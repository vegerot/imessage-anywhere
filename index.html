<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="text-scale" content="scale">
<title>Messages</title>
<style>
	/*
	 * Look and feel follows Messages.app: macOS at desktop widths, iOS at phone widths.
	 * Dark values were measured on 2026-11-12 from window captures of Messages.app 27.2
	 * (macOS) and of iOS 27 Messages through iPhone Mirroring. Light values are Apple's
	 * system colors (not measured).
	 */
	:root {
		color-scheme: light dark;

		--sidebar-bg: light-dark(oklch(96.3% 0.007 286), oklch(31.4% 0 0));
		--conversation-bg: light-dark(white, oklch(27.7% 0 0));
		--selected-row-bg: light-dark(oklch(89% 0.007 286), oklch(40.7% 0 0));
		--separator: light-dark(oklch(86.2% 0.007 286), oklch(43.2% 0 0));
		--text: light-dark(black, oklch(94.3% 0 0));
		--secondary-text: light-dark(oklch(64.8% 0.007 286), oklch(60.4% 0 0));
		--accent: light-dark(oklch(60.3% 0.218 257), oklch(70.2% 0.151 251));
		--avatar-bg: linear-gradient(light-dark(oklch(76% 0.01 286), oklch(62% 0 0)), light-dark(oklch(62% 0.01 286), oklch(48% 0 0)));

		--imessage-bubble: light-dark(oklch(60.3% 0.218 257), oklch(70.7% 0.148 251));
		--sms-bubble: light-dark(oklch(73% 0.194 147), oklch(75.6% 0.208 147)); /* systemGreen */
		--received-bubble: light-dark(oklch(93.5% 0.003 286), oklch(41.6% 0 0));
		--tapback-bg: light-dark(oklch(93.5% 0.003 286), oklch(36% 0 0));

		--sidebar-width: 20rem; /* 320 pt */
		--avatar-size: 2.5rem; /* 40 pt */
		--unread-dot-size: 0.5625rem; /* 9 pt */
		--bubble-radius: 1.125rem;
		--gutter: 0.75rem;
		--banner-layer: 10;

		accent-color: var(--accent);
	}

	body {
		display: grid;
		grid-template-columns: var(--sidebar-width) 1fr;
		block-size: 100dvh;
		margin: 0;
		overflow: hidden;

		font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
		line-height: 1.3;
		color: var(--text);

		background: var(--conversation-bg);
	}

	nav {
		overflow-y: auto;

		background: var(--sidebar-bg);

		h1 {
			display: none;
		}
	}

	#conversations {
		display: grid;
		margin: 0;
		padding: 0.5rem;

		list-style: none;

		a {
			display: grid;
			grid-template-columns: var(--unread-dot-size) var(--avatar-size) 1fr auto;
			grid-template-areas:
				"dot avatar name    when"
				"dot avatar preview preview";
			column-gap: 0.625rem;
			align-items: start;
			padding: 0.75rem 0.75rem 0.75rem 0.25rem;

			font-size: 0.9375rem; /* ~15 pt, as in the macOS sidebar */
			color: inherit;
			text-decoration: none;

			border-radius: 0.75rem;

			&[aria-current="page"] {
				background: var(--selected-row-bg);
			}

			&:focus-visible {
				outline: 2px solid var(--accent);
			}
		}

		/* Hairline separators start at the text column, as in Messages.app. */
		li:not(:last-child) a:not([aria-current="page"]) {
			--text-column: calc(0.25rem + var(--unread-dot-size) + var(--avatar-size) + 2 * 0.625rem);

			background: linear-gradient(var(--separator), var(--separator)) no-repeat right bottom / calc(100% - var(--text-column) - 0.75rem) 1px;
		}

		li[data-unread] a::before {
			content: "";
			grid-area: dot;
			align-self: center;
			aspect-ratio: 1;

			background: var(--accent);
			border-radius: 50%;
		}
	}

	.avatar {
		grid-area: avatar;
		display: grid;
		place-items: center;
		align-self: center;
		inline-size: var(--avatar-size);
		aspect-ratio: 1;

		font-size: 1rem;
		font-weight: 600;
		color: white;

		background: var(--avatar-bg);
		border-radius: 50%;

		svg {
			inline-size: 62%;
			fill: currentColor;
		}
	}

	.name {
		grid-area: name;
		overflow: hidden;

		font-weight: 600;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.when {
		grid-area: when;

		font-size: 0.8125rem;
		color: var(--secondary-text);
		font-variant-numeric: tabular-nums;
	}

	.preview {
		grid-area: preview;
		display: -webkit-box;
		min-block-size: 2lh;
		overflow: hidden;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;

		color: var(--secondary-text);
		overflow-wrap: anywhere;
	}

	#connection {
		position: fixed;
		inset-block-start: 0.75rem;
		inset-inline: 0;
		z-index: var(--banner-layer);
		inline-size: fit-content;
		margin: 0 auto;
		padding: 0.375rem 0.875rem;

		font-size: 0.8125rem;
		color: white;

		background: oklch(55% 0.19 25);
		border-radius: 1rem;
	}

	/* The Conversation pane. */
	main {
		display: grid;
		grid-template-rows: auto 1fr;
		min-block-size: 0;

		> p {
			grid-row: 1 / -1;
			place-self: center;

			color: var(--secondary-text);
		}

		header {
			display: grid;
			grid-template-columns: auto 1fr auto;
			align-items: center;
			padding: 0.75rem var(--gutter);

			border-block-end: 1px solid var(--separator);

			h2 {
				grid-column: 2;
				margin: 0;
				justify-self: center;

				font-size: 0.9375rem;
				text-align: center;
			}

			.back {
				display: none;
			}
		}
	}

	#messages {
		display: flex;
		flex-direction: column;
		gap: 0.125rem;
		margin: 0;
		padding: 1rem var(--gutter);
		overflow-y: auto;

		list-style: none;

		.divider {
			align-self: center;
			margin-block: 0.75rem 0.25rem;

			font-size: 0.75rem;
			color: var(--secondary-text);

			b {
				font-weight: 600;
			}
		}

		.sender {
			margin-block-start: 0.5rem;
			padding-inline-start: 0.75rem;

			font-size: 0.75rem;
			color: var(--secondary-text);
		}

		.message {
			display: grid;
			justify-items: start;
			max-inline-size: min(70%, 34rem);

			&.from-me {
				align-self: end;
				justify-items: end;
			}

			&:has(.tapbacks) {
				margin-block-start: 1.25rem;
			}
		}

		.bubble {
			position: relative;
			margin: 0;
			padding: 0.4375rem 0.75rem;

			font-size: 1rem;
			white-space: pre-wrap;
			overflow-wrap: anywhere;

			background: var(--received-bubble);
			border-radius: var(--bubble-radius);

			.from-me & {
				color: white;

				background: var(--sms-bubble);
			}

			.from-me.imessage & {
				background: var(--imessage-bubble);
			}

			a {
				color: inherit;
			}
		}

		.placeholder {
			display: block;

			font-style: italic;
			opacity: 0.8;
		}

		.tapbacks {
			position: absolute;
			inset-block-start: -1.125rem;
			inset-inline-end: -0.625rem;
			padding: 0.125rem 0.375rem;

			font-size: 0.875rem;
			white-space: nowrap;

			background: var(--tapback-bg);
			border: 2px solid var(--conversation-bg);
			border-radius: 1rem;

			.from-me & {
				inset-inline: -0.625rem auto;
			}
		}

		.edited {
			padding-inline: 0.75rem;

			font-size: 0.6875rem;
			color: var(--secondary-text);
		}
	}

	main {
		grid-template-rows: auto 1fr auto;
	}

	.composer {
		display: grid;
		grid-template-columns: 1fr auto;
		align-items: end;
		padding: 0.5rem var(--gutter) 0.75rem;
		gap: 0.5rem;

		textarea {
			field-sizing: content;
			max-block-size: 8lh;
			padding: 0.375rem 0.875rem;

			font: inherit;
			font-size: 1rem;
			color: inherit;

			background: transparent;
			border: 1px solid var(--separator);
			border-radius: 1.125rem;
			resize: none;
		}

		button {
			inline-size: 2rem;
			aspect-ratio: 1;
			padding: 0;

			font-size: 1.125rem;
			font-weight: 700;
			color: white;

			background: var(--imessage-bubble);
			border: 0;
			border-radius: 50%;

			cursor: pointer;
		}

		&:has(textarea:placeholder-shown) button {
			opacity: 0.4;
		}
	}

	main:not(.imessage) .composer button {
		background: var(--sms-bubble);
	}

	#messages .delivery {
		padding-inline: 0.75rem;

		font-size: 0.6875rem;
		color: var(--secondary-text);

		&.warning {
			color: oklch(62% 0.2 30);
		}
	}

	/* Switching Conversations (same-document View Transitions): a quick fade on desktop, and
	   at phone width the iOS push from the list into a Conversation, popped in reverse. */
	::view-transition-group(root) {
		animation-duration: 0.15s;
	}

	@media (width < 45em) {
		::view-transition-group(root) {
			animation-duration: 0.35s;
		}

		::view-transition-old(root),
		::view-transition-new(root) {
			animation-duration: 0.35s;
			animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
			animation-fill-mode: both;
			mix-blend-mode: normal;
		}

		::view-transition-old(root) {
			animation-name: push-out;
		}

		::view-transition-new(root) {
			animation-name: push-in;
		}

		:root[data-direction="back"] {
			&::view-transition-old(root) {
				z-index: var(--banner-layer);
				animation-name: pop-out;
			}

			&::view-transition-new(root) {
				animation-name: pop-in;
			}
		}
	}

	@keyframes push-in {
		from { translate: 100% 0; }
	}

	@keyframes push-out {
		to { translate: -30% 0; filter: brightness(0.8); }
	}

	@keyframes pop-in {
		from { translate: -30% 0; filter: brightness(0.8); }
	}

	@keyframes pop-out {
		to { translate: 100% 0; }
	}

	main h2:focus-visible {
		outline: 2px solid var(--accent);
		outline-offset: 2px;
	}

	/* Phone width: iOS layout. The list and the Conversation are separate screens. */
	@media (width < 45em) {
		:root {
			--conversation-bg: light-dark(white, black);
			--received-bubble: light-dark(oklch(93.5% 0.003 286), oklch(32.2% 0.009 284)); /* iOS, measured */
			--separator: light-dark(oklch(86.2% 0.007 286), oklch(23.7% 0 0)); /* iOS, measured */
			--avatar-bg: linear-gradient(light-dark(oklch(72% 0.03 295), oklch(52% 0.04 295)), light-dark(oklch(60% 0.03 295), oklch(44% 0.04 295))); /* iOS, measured */
		}

		body {
			grid-template-columns: 1fr;
		}

		body:has(main[data-open]) nav,
		body:not(:has(main[data-open])) main {
			display: none;
		}

		nav {
			background: var(--conversation-bg);

			/* iOS 27 centers a small title, not a large one. */
			h1 {
				display: block;
				margin: 0;
				padding: 0.75rem 1rem 0.25rem;

				font-size: 1.0625rem;
				text-align: center;
			}
		}

		#conversations a {
			grid-template-columns: var(--unread-dot-size) var(--avatar-size) 1fr auto;
			font-size: 1rem;
			border-radius: 0;

			.name {
				font-size: 1.0625rem;
			}

			.when,
			.preview {
				font-size: 0.9375rem;
			}

			.when::after {
				content: " ›";
			}
		}

		main header .back {
			display: block;
			padding-inline-end: 0.5rem;

			font-size: 1.75rem;
			line-height: 1;
			color: var(--accent);
			text-decoration: none;
		}

		#messages .bubble {
			font-size: 1.0625rem;
		}
	}
</style>
</head>
<body>
	<p id="connection" role="status" hidden>Can’t reach the Host Mac. Reconnecting…</p>
	<nav aria-label="Conversations">
		<h1>Messages</h1>
		<ul id="conversations"></ul>
	</nav>
	<main>
		<p id="status">Loading Conversations…</p>
	</main>

	<template id="conversation-row">
		<li>
			<a>
				<span class="avatar" aria-hidden="true"></span>
				<span class="name"></span>
				<time class="when"></time>
				<span class="preview"></span>
			</a>
		</li>
	</template>

	<template id="conversation-view">
		<header>
			<a class="back" href="/" aria-label="Back to Conversations">‹</a>
			<h2 tabindex="-1"></h2>
		</header>
		<ol id="messages" aria-live="polite"></ol>
		<form class="composer">
			<textarea name="text" rows="1" required aria-label="Message" enterkeyhint="send"></textarea>
			<button aria-label="Send">↑</button>
		</form>
	</template>

	<template id="person-glyph">
		<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg>
	</template>

<script type="module" src="/app.js"></script>
</body>
</html>
