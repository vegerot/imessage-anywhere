<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="text-scale" content="scale">
<title>Messages</title>
<style>
	/*
	 * Look and feel follows Messages.app: macOS at desktop widths, iOS at phone widths.
	 * Dark values were measured on 2026-11-12 from window captures of Messages.app 27.2
	 * (macOS) and of iOS 27 Messages through iPhone Mirroring. Light values are Apple's
	 * system colors (not measured).
	 */
	:root {
		color-scheme: light dark;

		--sidebar-bg: light-dark(oklch(96.3% 0.007 286), oklch(31.4% 0 0));
		--conversation-bg: light-dark(white, oklch(27.7% 0 0));
		--selected-row-bg: light-dark(oklch(89% 0.007 286), oklch(40.7% 0 0));
		--separator: light-dark(oklch(86.2% 0.007 286), oklch(43.2% 0 0));
		--text: light-dark(black, oklch(94.3% 0 0));
		--secondary-text: light-dark(oklch(64.8% 0.007 286), oklch(60.4% 0 0));
		--accent: light-dark(oklch(60.3% 0.218 257), oklch(70.2% 0.151 251));
		--avatar-bg: linear-gradient(light-dark(oklch(76% 0.01 286), oklch(62% 0 0)), light-dark(oklch(62% 0.01 286), oklch(48% 0 0)));

		--imessage-bubble: light-dark(oklch(60.3% 0.218 257), oklch(70.7% 0.148 251));
		--sms-bubble: light-dark(oklch(73% 0.194 147), oklch(75.6% 0.208 147)); /* systemGreen */
		--received-bubble: light-dark(oklch(93.5% 0.003 286), oklch(41.6% 0 0));
		--tapback-bg: light-dark(oklch(93.5% 0.003 286), oklch(36% 0 0));

		--sidebar-width: 20rem; /* 320 pt */
		--avatar-size: 2.5rem; /* 40 pt */
		--unread-dot-size: 0.5625rem; /* 9 pt */
		--bubble-radius: 1.125rem;
		--gutter: 0.75rem;
		--banner-layer: 10;

		accent-color: var(--accent);
	}

	body {
		display: grid;
		grid-template-columns: var(--sidebar-width) 1fr;
		block-size: 100dvh;
		margin: 0;
		overflow: hidden;

		font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
		line-height: 1.3;
		color: var(--text);

		background: var(--conversation-bg);
	}

	nav {
		overflow-y: auto;

		background: var(--sidebar-bg);

		h1 {
			display: none;
		}
	}

	#conversations {
		display: grid;
		margin: 0;
		padding: 0.5rem;

		list-style: none;

		a {
			display: grid;
			grid-template-columns: var(--unread-dot-size) var(--avatar-size) 1fr auto;
			grid-template-areas:
				"dot avatar name    when"
				"dot avatar preview preview";
			column-gap: 0.625rem;
			align-items: start;
			padding: 0.75rem 0.75rem 0.75rem 0.25rem;

			font-size: 0.9375rem; /* ~15 pt, as in the macOS sidebar */
			color: inherit;
			text-decoration: none;

			border-radius: 0.75rem;

			&[aria-current="page"] {
				background: var(--selected-row-bg);
			}

			&:focus-visible {
				outline: 2px solid var(--accent);
			}
		}

		/* Hairline separators start at the text column, as in Messages.app. */
		li:not(:last-child) a:not([aria-current="page"]) {
			--text-column: calc(0.25rem + var(--unread-dot-size) + var(--avatar-size) + 2 * 0.625rem);

			background: linear-gradient(var(--separator), var(--separator)) no-repeat right bottom / calc(100% - var(--text-column) - 0.75rem) 1px;
		}

		li[data-unread] a::before {
			content: "";
			grid-area: dot;
			align-self: center;
			aspect-ratio: 1;

			background: var(--accent);
			border-radius: 50%;
		}
	}

	.avatar {
		grid-area: avatar;
		display: grid;
		place-items: center;
		align-self: center;
		inline-size: var(--avatar-size);
		aspect-ratio: 1;

		font-size: 1rem;
		font-weight: 600;
		color: white;

		background: var(--avatar-bg);
		border-radius: 50%;

		svg {
			inline-size: 62%;
			fill: currentColor;
		}
	}

	.name {
		grid-area: name;
		overflow: hidden;

		font-weight: 600;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.when {
		grid-area: when;

		font-size: 0.8125rem;
		color: var(--secondary-text);
		font-variant-numeric: tabular-nums;
	}

	.preview {
		grid-area: preview;
		display: -webkit-box;
		min-block-size: 2lh;
		overflow: hidden;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;

		color: var(--secondary-text);
		overflow-wrap: anywhere;
	}

	#connection {
		position: fixed;
		inset-block-start: 0.75rem;
		inset-inline: 0;
		z-index: var(--banner-layer);
		inline-size: fit-content;
		margin: 0 auto;
		padding: 0.375rem 0.875rem;

		font-size: 0.8125rem;
		color: white;

		background: oklch(55% 0.19 25);
		border-radius: 1rem;
	}

	/* The Conversation pane. */
	main {
		display: grid;
		grid-template-rows: auto 1fr;
		min-block-size: 0;

		> p {
			grid-row: 1 / -1;
			place-self: center;

			color: var(--secondary-text);
		}

		header {
			display: grid;
			grid-template-columns: auto 1fr auto;
			align-items: center;
			padding: 0.75rem var(--gutter);

			border-block-end: 1px solid var(--separator);

			h2 {
				grid-column: 2;
				margin: 0;
				justify-self: center;

				font-size: 0.9375rem;
				text-align: center;
			}

			.back {
				display: none;
			}
		}
	}

	#messages {
		display: flex;
		flex-direction: column;
		gap: 0.125rem;
		margin: 0;
		padding: 1rem var(--gutter);
		overflow-y: auto;

		list-style: none;

		.divider {
			align-self: center;
			margin-block: 0.75rem 0.25rem;

			font-size: 0.75rem;
			color: var(--secondary-text);

			b {
				font-weight: 600;
			}
		}

		.sender {
			margin-block-start: 0.5rem;
			padding-inline-start: 0.75rem;

			font-size: 0.75rem;
			color: var(--secondary-text);
		}

		.message {
			display: grid;
			justify-items: start;
			max-inline-size: min(70%, 34rem);

			&.from-me {
				align-self: end;
				justify-items: end;
			}

			&:has(.tapbacks) {
				margin-block-start: 1.25rem;
			}
		}

		.bubble {
			position: relative;
			margin: 0;
			padding: 0.4375rem 0.75rem;

			font-size: 1rem;
			white-space: pre-wrap;
			overflow-wrap: anywhere;

			background: var(--received-bubble);
			border-radius: var(--bubble-radius);

			.from-me & {
				color: white;

				background: var(--sms-bubble);
			}

			.from-me.imessage & {
				background: var(--imessage-bubble);
			}

			a {
				color: inherit;
			}
		}

		.placeholder {
			display: block;

			font-style: italic;
			opacity: 0.8;
		}

		.tapbacks {
			position: absolute;
			inset-block-start: -1.125rem;
			inset-inline-end: -0.625rem;
			padding: 0.125rem 0.375rem;

			font-size: 0.875rem;
			white-space: nowrap;

			background: var(--tapback-bg);
			border: 2px solid var(--conversation-bg);
			border-radius: 1rem;

			.from-me & {
				inset-inline: -0.625rem auto;
			}
		}

		.edited {
			padding-inline: 0.75rem;

			font-size: 0.6875rem;
			color: var(--secondary-text);
		}
	}

	main {
		grid-template-rows: auto 1fr auto;
	}

	.composer {
		display: grid;
		grid-template-columns: 1fr auto;
		align-items: end;
		padding: 0.5rem var(--gutter) 0.75rem;
		gap: 0.5rem;

		textarea {
			field-sizing: content;
			max-block-size: 8lh;
			padding: 0.375rem 0.875rem;

			font: inherit;
			font-size: 1rem;
			color: inherit;

			background: transparent;
			border: 1px solid var(--separator);
			border-radius: 1.125rem;
			resize: none;
		}

		button {
			inline-size: 2rem;
			aspect-ratio: 1;
			padding: 0;

			font-size: 1.125rem;
			font-weight: 700;
			color: white;

			background: var(--imessage-bubble);
			border: 0;
			border-radius: 50%;

			cursor: pointer;
		}

		&:has(textarea:placeholder-shown) button {
			opacity: 0.4;
		}
	}

	main:not(.imessage) .composer button {
		background: var(--sms-bubble);
	}

	#messages .delivery {
		padding-inline: 0.75rem;

		font-size: 0.6875rem;
		color: var(--secondary-text);

		&.warning {
			color: oklch(62% 0.2 30);
		}
	}

	/* Phone width: iOS layout. The list and the Conversation are separate screens. */
	@media (width < 45em) {
		:root {
			--conversation-bg: light-dark(white, black);
			--received-bubble: light-dark(oklch(93.5% 0.003 286), oklch(32.2% 0.009 284)); /* iOS, measured */
			--separator: light-dark(oklch(86.2% 0.007 286), oklch(23.7% 0 0)); /* iOS, measured */
			--avatar-bg: linear-gradient(light-dark(oklch(72% 0.03 295), oklch(52% 0.04 295)), light-dark(oklch(60% 0.03 295), oklch(44% 0.04 295))); /* iOS, measured */
		}

		body {
			grid-template-columns: 1fr;
		}

		body:has(main[data-open]) nav,
		body:not(:has(main[data-open])) main {
			display: none;
		}

		nav {
			background: var(--conversation-bg);

			/* iOS 27 centers a small title, not a large one. */
			h1 {
				display: block;
				margin: 0;
				padding: 0.75rem 1rem 0.25rem;

				font-size: 1.0625rem;
				text-align: center;
			}
		}

		#conversations a {
			grid-template-columns: var(--unread-dot-size) var(--avatar-size) 1fr auto;
			font-size: 1rem;
			border-radius: 0;

			.name {
				font-size: 1.0625rem;
			}

			.when,
			.preview {
				font-size: 0.9375rem;
			}

			.when::after {
				content: " ›";
			}
		}

		main header .back {
			display: block;
			padding-inline-end: 0.5rem;

			font-size: 1.75rem;
			line-height: 1;
			color: var(--accent);
			text-decoration: none;
		}

		#messages .bubble {
			font-size: 1.0625rem;
		}
	}
</style>
</head>
<body>
	<p id="connection" role="status" hidden>Can’t reach the Host Mac. Reconnecting…</p>
	<nav aria-label="Conversations">
		<h1>Messages</h1>
		<ul id="conversations"></ul>
	</nav>
	<main>
		<p id="status">Loading Conversations…</p>
	</main>

	<template id="conversation-row">
		<li>
			<a>
				<span class="avatar" aria-hidden="true"></span>
				<span class="name"></span>
				<time class="when"></time>
				<span class="preview"></span>
			</a>
		</li>
	</template>

	<template id="conversation-view">
		<header>
			<a class="back" href="#" aria-label="Back to Conversations">‹</a>
			<h2></h2>
		</header>
		<ol id="messages" aria-live="polite"></ol>
		<form class="composer">
			<textarea name="text" rows="1" required aria-label="Message" enterkeyhint="send"></textarea>
			<button aria-label="Send">↑</button>
		</form>
	</template>

	<template id="person-glyph">
		<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg>
	</template>

<script type="module">
	const list = document.querySelector("#conversations");
	const main = document.querySelector("main");
	const status = document.querySelector("#status");
	const rowTemplate = document.querySelector("#conversation-row");
	const viewTemplate = document.querySelector("#conversation-view");
	const personGlyph = document.querySelector("#person-glyph");

	const conversations = new Map(); // id -> Conversation
	const rows = new Map(); // id -> list row
	const dayFormat = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
	const timeOfDay = (date) => date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

	function daysAgo(date) {
		const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
		return Math.round((startOfDay(new Date()) - startOfDay(date)) / 86_400_000);
	}

	function capitalized(text) {
		return text[0].toUpperCase() + text.slice(1);
	}

	// Messages.app list style: a time today, "Yesterday", a weekday within the week, else a date.
	function formatWhen(date) {
		const days = daysAgo(date);
		if (days === 0) return timeOfDay(date);
		if (days === 1) return capitalized(dayFormat.format(-1, "day"));
		if (days < 7) return date.toLocaleDateString([], { weekday: "long" });
		return date.toLocaleDateString([], { year: "2-digit", month: "numeric", day: "numeric" });
	}

	// Messages.app divider style: "Today 12:26 AM", "Yesterday 8:13 AM", "Tuesday 3:00 PM", "Nov 2 at 3:00 PM".
	function dividerParts(date) {
		const days = daysAgo(date);
		if (days < 2) return [capitalized(dayFormat.format(-days, "day")), timeOfDay(date)];
		if (days < 7) return [date.toLocaleDateString([], { weekday: "long" }), timeOfDay(date)];
		return [date.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }), timeOfDay(date)];
	}

	// Initials for a name; a person glyph for a raw number, email, or short code.
	function fillAvatar(avatar, name) {
		const words = name.split(/\s+/).filter((w) => /^\p{L}/u.test(w));
		if (words.length === 0) {
			avatar.append(personGlyph.content.cloneNode(true));
			return;
		}
		avatar.textContent = words.slice(0, 2).map((w) => w[0].toUpperCase()).join("");
	}

	function renderRow(conversation) {
		const row = rowTemplate.content.firstElementChild.cloneNode(true);
		const link = row.querySelector("a");
		link.href = `#/conversations/${conversation.id}`;
		fillAvatar(row.querySelector(".avatar"), conversation.name);
		row.querySelector(".name").textContent = conversation.name;
		const when = row.querySelector(".when");
		when.dateTime = conversation.lastMessageAt;
		when.textContent = formatWhen(new Date(conversation.lastMessageAt));
		row.toggleAttribute("data-unread", conversation.unread > 0);
		return row;
	}

	async function getJSON(url) {
		const response = await fetch(url);
		if (!response.ok) throw new Error(`${url}: ${response.status} ${await response.text()}`);
		return response.json();
	}

	// The open Conversation's history goes first: imsg's reads contend, and with previews in
	// flight a 0.5 s history read took 2.75 s (measured 2026-11-12).
	let conversationLoading = Promise.resolve();

	// Previews need one request per Conversation, so they fill in after the list shows.
	async function fillPreviews() {
		const queue = [...rows];
		const worker = async () => {
			for (let entry = queue.shift(); entry; entry = queue.shift()) {
				await conversationLoading;
				const [id, row] = entry;
				const [last] = await getJSON(`/api/conversations/${id}/messages?limit=1`).catch(() => []);
				if (last) noteSeen(last);
				row.querySelector(".preview").textContent = last ? last.text || last.placeholder || "" : "";
			}
		};
		// Two workers leave two of imsg's four read lanes free, so opening a Conversation never waits behind previews.
		await Promise.all(Array.from({ length: 2 }, worker));
	}

	// Text with clickable links; everything else stays plain text (never parsed as HTML).
	function linkified(text) {
		const fragment = document.createDocumentFragment();
		let rest = 0;
		for (const match of text.matchAll(/https?:\/\/[^\s<>"]+[^\s<>".,;:!?)\]]/g)) {
			fragment.append(text.slice(rest, match.index));
			const link = document.createElement("a");
			link.href = match[0];
			link.target = "_blank";
			link.rel = "noopener noreferrer";
			link.textContent = match[0];
			fragment.append(link);
			rest = match.index + match[0].length;
		}
		fragment.append(text.slice(rest));
		return fragment;
	}

	const dividerGap = 60 * 60 * 1000; // a new time divider after an hour of silence

	function renderMessages(conversation, messages) {
		const items = [];
		let previous;
		for (const message of messages) {
			const at = new Date(message.createdAt);
			const newDivider = !previous || at - new Date(previous.createdAt) > dividerGap;
			if (newDivider) {
				const divider = document.createElement("li");
				divider.className = "divider";
				const [day, time] = dividerParts(at);
				const bold = document.createElement("b");
				bold.textContent = day;
				divider.append(bold, ` ${time}`);
				items.push(divider);
			}
			const newSender = newDivider || previous.fromMe !== message.fromMe || previous.sender !== message.sender;
			if (conversation.isGroup && !message.fromMe && newSender) {
				const sender = document.createElement("li");
				sender.className = "sender";
				sender.textContent = message.senderName;
				items.push(sender);
			}
			items.push(renderMessage(conversation, message));
			previous = message;
		}
		return items;
	}

	function renderMessage(conversation, message) {
		const item = document.createElement("li");
		item.className = "message";
		item.classList.toggle("from-me", message.fromMe);
		item.classList.toggle("imessage", conversation.service === "iMessage");
		item.dataset.id = message.id;

		const bubble = document.createElement("p");
		bubble.className = "bubble";
		if (message.text) bubble.append(linkified(message.text));
		if (message.placeholder) {
			const placeholder = document.createElement("span");
			placeholder.className = "placeholder";
			placeholder.textContent = message.placeholder;
			bubble.append(placeholder);
		}
		if (message.reactions?.length) {
			const tapbacks = document.createElement("span");
			tapbacks.className = "tapbacks";
			tapbacks.textContent = message.reactions.map((r) => r.emoji).join("");
			tapbacks.title = message.reactions.map((r) => `${r.from}: ${r.emoji}`).join("\n");
			bubble.append(tapbacks);
		}
		item.append(bubble);
		const delivery = deliveryLabels[message.delivery];
		if (delivery) {
			const label = document.createElement("small");
			label.className = "delivery";
			label.classList.toggle("warning", message.delivery !== "sending");
			label.textContent = delivery;
			item.append(label);
		}
		if (message.edited) {
			const edited = document.createElement("small");
			edited.className = "edited";
			edited.textContent = "Edited";
			item.append(edited);
		}
		return item;
	}

	// What the page shows under a bubble I'm sending. "unconfirmed" may have been delivered,
	// so it's never resent automatically.
	const deliveryLabels = {
		sending: "Sending…",
		unconfirmed: "Not confirmed. Check Messages before resending.",
		failed: "Not sent.",
	};
	let pendingCount = 0;
	const sendsOnEnter = matchMedia("(pointer: fine)").matches; // desktop, like Messages.app

	let openID = null;
	let openMessages = [];
	let lastEventID = 0; // the newest Message row ID seen anywhere: the live stream resumes after it

	function noteSeen(message) {
		lastEventID = Math.max(lastEventID, message.id);
	}

	async function openConversation(id) {
		openID = id;
		for (const [rowID, row] of rows) {
			const link = row.querySelector("a");
			if (rowID === id) link.setAttribute("aria-current", "page");
			else link.removeAttribute("aria-current");
		}
		const conversation = conversations.get(id);
		if (!conversation) {
			main.removeAttribute("data-open");
			main.replaceChildren(status);
			status.textContent = "Select a Conversation";
			return;
		}
		main.setAttribute("data-open", "");
		main.replaceChildren(viewTemplate.content.cloneNode(true));
		main.querySelector("h2").textContent = conversation.name;
		main.classList.toggle("imessage", conversation.service === "iMessage");
		setUpComposer(conversation);
		const loading = getJSON(`/api/conversations/${id}/messages`);
		conversationLoading = loading.catch(() => {});
		const messages = await loading;
		if (openID !== id) return; // the user opened another Conversation meanwhile
		messages.forEach(noteSeen);
		openMessages = messages;
		showMessages(conversation, { scrollToEnd: true });
	}

	function showMessages(conversation, { scrollToEnd }) {
		const list = main.querySelector("#messages");
		const nearEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
		list.replaceChildren(...renderMessages(conversation, openMessages));
		if (scrollToEnd || nearEnd) list.scrollTop = list.scrollHeight;
	}

	function setUpComposer(conversation) {
		const form = main.querySelector(".composer");
		const textarea = form.elements.text;
		textarea.placeholder = conversation.service === "iMessage" ? "iMessage" : `Text Message • ${conversation.service}`;
		textarea.addEventListener("keydown", (event) => {
			if (sendsOnEnter && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
				event.preventDefault();
				form.requestSubmit();
			}
		});
		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			const text = textarea.value;
			textarea.value = "";
			const pending = { id: `pending-${++pendingCount}`, fromMe: true, text, createdAt: new Date().toISOString(), delivery: "sending" };
			openMessages.push(pending);
			showMessages(conversation, { scrollToEnd: true });
			pending.delivery = await send(conversation.id, text, pending);
			if (openID === conversation.id) showMessages(conversation, { scrollToEnd: false });
		});
	}

	// Returns the pending bubble's delivery state once the Proxy answers.
	async function send(conversationID, text, pending) {
		try {
			const response = await fetch(`/api/conversations/${conversationID}/messages`, {
				method: "POST",
				body: new URLSearchParams({ text }),
			});
			if (!response.ok) return "failed";
			const result = await response.json();
			if (result.status !== "confirmed") return "unconfirmed";
			// The live stream may already have delivered this row; then drop the pending copy.
			if (openMessages.some((m) => m.id === result.id)) {
				openMessages = openMessages.filter((m) => m !== pending);
				return undefined;
			}
			pending.id = result.id;
			return undefined;
		} catch {
			return "unconfirmed"; // the request may have reached the Proxy before the network failed
		}
	}

	// A new or changed Message arrived live: update its row, and the open Conversation.
	async function applyLiveMessage(message) {
		const id = message.conversationId;
		const conversation = conversations.get(id);
		if (!conversation) {
			await loadConversations(); // a Conversation the list doesn't have yet
			fillPreviews();
			return;
		}
		const row = rows.get(id);
		row.querySelector(".preview").textContent = message.text || message.placeholder || "";
		if (message.createdAt >= conversation.lastMessageAt) {
			conversation.lastMessageAt = message.createdAt;
			const when = row.querySelector(".when");
			when.dateTime = message.createdAt;
			when.textContent = formatWhen(new Date(message.createdAt));
			list.prepend(row);
		}
		if (!message.fromMe && openID !== id) row.toggleAttribute("data-unread", true);
		if (openID !== id) return;
		let index = openMessages.findIndex((m) => m.id === message.id);
		if (index < 0 && message.fromMe) {
			// My own send, arriving live before the POST answered: it takes over the pending bubble.
			index = openMessages.findIndex((m) => m.delivery === "sending" && m.text === message.text);
		}
		if (index >= 0) openMessages[index] = message; // an edit, a replay, or a send confirmed live
		else openMessages.push(message);
		showMessages(conversation, { scrollToEnd: message.fromMe });
	}

	const connection = document.querySelector("#connection");
	const quietLimit = 60_000; // the Proxy sends a heartbeat every 25 s
	let source;
	let watchdog;

	function setOnline(online) {
		connection.hidden = online;
	}

	// EventSource reconnects by itself after errors, sending Last-Event-ID. The watchdog
	// covers the case it can't see: a connection that died silently (the Host Mac slept).
	function connect() {
		source?.close();
		source = new EventSource(lastEventID ? `/api/events?since=${lastEventID}` : "/api/events");
		source.onopen = () => setOnline(true);
		source.onerror = () => setOnline(false);
		source.addEventListener("heartbeat", resetWatchdog);
		source.addEventListener("message", (event) => {
			resetWatchdog();
			const message = JSON.parse(event.data);
			noteSeen(message);
			applyLiveMessage(message);
		});
		resetWatchdog();
	}

	function resetWatchdog() {
		clearTimeout(watchdog);
		watchdog = setTimeout(() => {
			setOnline(false);
			connect();
		}, quietLimit);
	}

	function route() {
		const match = location.hash.match(/^#\/conversations\/(\d+)$/);
		openConversation(match ? Number(match[1]) : null).catch((error) => {
			main.replaceChildren(status);
			status.textContent = `Couldn't load the Conversation: ${error.message}`;
		});
	}

	async function loadConversations() {
		const fresh = await getJSON("/api/conversations");
		conversations.clear();
		rows.clear();
		for (const conversation of fresh) {
			conversations.set(conversation.id, conversation);
			rows.set(conversation.id, renderRow(conversation));
		}
		list.replaceChildren(...rows.values());
		rows.get(openID)?.querySelector("a").setAttribute("aria-current", "page");
	}

	try {
		await loadConversations();
		addEventListener("hashchange", route);
		route();
		fillPreviews();
		connect();
	} catch (error) {
		status.textContent = `Couldn't load Conversations: ${error.message}`;
	}
</script>
</body>
</html>
